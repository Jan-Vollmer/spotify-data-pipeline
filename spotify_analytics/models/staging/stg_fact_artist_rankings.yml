version: 2

models:
  - name: stg_fact_artist_rankings
    description: >
      Staging model for artist chart rankings. Grain: one row per
      artist+term+snapshot timestamp.
    columns:
      - name: artist_id
        description: References stg_dim_artist.artist_id.
        tests:
          - not_null
          - relationships:
              to: ref('stg_dim_artist')
              field: artist_id
      - name: position
        description: Artist's rank within the given chart term (1 = top).
        tests:
          - not_null
      - name: snapshot_date
        description: Timestamp at which the pipeline captured this rank.
        tests:
          - not_null